<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Christkindlmarkt — Pixel Village Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--gold:#e9bb4c;--cream:#f3e9d2;--ink:#0d0a1c;--panel:#16112b;--panel2:#221a3d;--line:#3b2f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f;color:var(--cream);font-family:'Pixelify Sans',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#stage{position:relative;flex:1;overflow:hidden;background:#070b1f;touch-action:none}
#stage{cursor:grab}
.lay{position:absolute;left:0;bottom:0;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;will-change:transform;transform:translateZ(0)}
#cFx{image-rendering:auto}
.src{display:none}
input[type=range]{accent-color:var(--gold);flex:1;min-width:90px}
.spdl{font-size:12px;width:56px;text-align:right;color:#cbbfa3}
#wallCtl{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));display:none;z-index:4;gap:8px;align-items:center;background:#16112bdd;border:2px solid var(--line);padding:6px 8px}
#wallCtl label{display:flex;align-items:center;gap:8px;font-size:13px}
#wallCtl input{width:120px}
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none;background:linear-gradient(#05060fcc,#05060f00)}
#top>*{pointer-events:auto}
.brand{font-family:'Silkscreen',monospace;font-size:15px;letter-spacing:1px;color:var(--gold);text-shadow:0 2px 0 #000;white-space:nowrap}
.brand small{display:block;font-family:'Pixelify Sans';font-size:11px;color:#cbbfa3;letter-spacing:0;text-shadow:none}
.tb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--cream);background:var(--panel2);border:2px solid var(--line);border-radius:0;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 #000;font-size:13px;line-height:1.1}
button:active{transform:translateY(1px);box-shadow:none}
button.gold{background:#5b3d12;border-color:var(--gold);color:#ffe6a6}
button.on{background:#3d2c0c;border-color:var(--gold);color:#ffe6a6}
#panel{background:var(--panel);border-top:3px solid var(--gold);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));position:relative}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;font-size:12px;padding:5px 2px;min-width:0}
#tiles{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;min-height:84px}
#tiles.scene{display:block;overflow:visible}
.srow{display:flex;align-items:center;gap:6px;margin:0 0 5px}
.srow .lab{width:74px;font-size:12px;color:#cbbfa3;flex:0 0 auto}
.srow .seg button{font-size:11.5px;padding:5px 2px}
.tile{touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:0 0 auto;width:70px;background:#0e0a1f;border:2px solid var(--line);padding:4px 2px 3px;text-align:center;cursor:pointer;box-shadow:0 2px 0 #000}
.tile canvas{width:52px;height:52px;image-rendering:pixelated;display:block;margin:0 auto 2px}
.tile span{font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9cdb2}
.tile.sel{border-color:var(--gold);background:#2a1f08}
.hint{font-size:11.5px;color:#a99dc4;margin-top:4px;min-height:14px}
#inspector .row{display:flex;align-items:center;gap:6px;margin:5px 0;flex-wrap:wrap}
#inspector .lab{width:64px;font-size:12px;color:#cbbfa3}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;font-size:12px;padding:5px 4px}
#inspector h3{margin:0 0 4px;font-family:'Silkscreen';font-size:14px;color:var(--gold);display:flex;justify-content:space-between;align-items:center;font-weight:400}
#inspector .acts{display:flex;gap:6px;margin-top:6px}
#inspector .acts button{flex:1}
button.danger{background:#4a1418;border-color:#a3353b}
#sheet{position:absolute;inset:0;background:#05060fb0;display:flex;align-items:center;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
#sheet .card{background:var(--panel);border:3px solid var(--gold);padding:14px;width:min(380px,92vw);box-shadow:0 6px 0 #000}
#sheet h2{font-family:'Silkscreen';font-weight:400;font-size:16px;color:var(--gold);margin:0 0 10px}
#sheet .row{display:flex;align-items:center;gap:6px;margin:8px 0}
#sheet .lab{width:96px;font-size:13px;color:#cbbfa3}
#sheet .foot{display:flex;gap:6px;margin-top:12px}
#sheet .foot button{flex:1}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#1b1433ee;border:2px solid var(--gold);padding:6px 12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
body.wall #top,body.wall #panel{display:none}
body.wall #stage{cursor:default}
body.wall.peek #wallCtl{display:flex}
[hidden]{display:none!important}
body.svc #wallCtl,body.svc #top,body.svc #panel,body.svc #toast{display:none!important}
body.svc #stage{cursor:default}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:30;width:68px;height:68px;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #000);display:none;border:2px solid var(--gold);background:#141c3a}
#dragLbl{position:absolute;pointer-events:none;z-index:6;transform:translateX(-50%);background:#1b1433f0;border:2px solid #ff8a4c;color:#ffe6d6;font-size:12.5px;padding:4px 9px;white-space:nowrap;display:none;box-shadow:0 3px 0 #000}
#dragLbl.place{border-color:#7ce08a;color:#e4ffe9}
#dragLbl.bad{border-color:#e04848;color:#ffd6d6}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging .tile.drag{opacity:.45}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cSky" class="src"></canvas><canvas id="cFar" class="src"></canvas><canvas id="cMtn" class="src"></canvas><canvas id="cFor" class="src"></canvas><canvas id="cv" class="src"></canvas><canvas id="cFx" class="lay"></canvas>
    <div id="top">
      <div class="brand">Christkindlmarkt<small>build your winter market</small></div>
      <div class="tb">
        <button id="bTime" title="Time of day">Blue hour</button>
        <button id="bSnow" title="Snowfall">❄ Light</button>
        <button id="bSet" title="Settings">⚙</button>
        <button id="bWall" class="gold">▶ Wallpaper</button>
      </div>
    </div>
    <div id="toast"></div><div id="dragLbl"></div>
    <div id="wallCtl"><label>Drift<input type="range" id="spdW" min="0" max="100"></label><button id="exitWall" class="gold">✕ Exit</button></div>
    <div id="sheet" hidden>
      <div class="card">
        <h2>Market settings</h2>
        <div class="row"><span class="lab">Time of day</span><div class="seg" data-k="time"></div></div>
        <div class="row"><span class="lab">Snowfall</span><div class="seg" data-k="snow"></div></div>
        <div class="row"><span class="lab">Snow cover</span><div class="seg" data-k="cover"></div></div>
        
        <div class="row"><span class="lab">Home swipes</span><div class="seg" data-k="follow"></div></div>
        <div class="row"><span class="lab">Drift speed</span><input type="range" id="spd" min="0" max="100" class="rng"><span id="spdL" class="spdl"></span></div>
        <div class="foot"><button id="bSample">Sample market</button><button id="bClear" class="danger">Clear all</button></div>
        <div class="foot"><button id="bClose" class="gold">Done</button></div>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="palette">
      <div class="tabs"><button data-cat="Buildings" class="on">Buildings</button><button data-cat="Stalls">Stalls</button><button data-cat="Decor">Decor</button><button data-cat="Scene">Scene</button><button data-cat="People">People</button></div>
      <div id="tiles"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div id="inspector" hidden>
      <h3><span id="iName">Item</span><button id="iDone" class="gold">Done</button></h3>
      <div class="row" id="rLights"><span class="lab">Lights</span><div class="seg" data-p="lights"></div></div>
      <div class="row" id="rGarland"><span class="lab" id="gLab">Garland</span><div class="seg" data-p="garland"></div></div>
      <div class="acts"><button id="iStyle">⟳ Restyle</button><button id="iDel" class="danger">Remove</button></div>
      <div class="hint">Drag it on the street to move it.</div>
    </div>
  </div>
</div>
<canvas id="ghost"></canvas>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stageEl=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d'),cSky=$('#cSky'),ctxS=cSky.getContext('2d'),cMtn=$('#cMtn'),ctxM=cMtn.getContext('2d'),
  cFar=$('#cFar'),ctxFar=cFar.getContext('2d'),cFor=$('#cFor'),ctxF=cFor.getContext('2d'),cFx=$('#cFx'),ctxX=cFx.getContext('2d');
const mk=()=>{const c=document.createElement('canvas');return [c,c.getContext('2d')]};
const [worldC,worldX]=mk(),[emC,emX]=mk(),[darkC,darkX]=mk();
let WORLD_W=560;const PAD=5;
let DW=202,DPR=1,CX=0,wpPhase=0,W=200,H=200,K=4,G=144,BY=148,WALK=162,FY=196;
let camX=120,T=0,dt=0.033,mode='build',tool=null,selected=null,cat='Buildings';
let LIGHTS=null,FX=false,cover=true,litProb=0.7;
let DRAG=null,flash=null,items=[],nextId=1,parts=[],flakes=[],lastCam=0,wpOff=null;
let S={follow:false,time:'blue',snow:'light',cover:true,santa:true,crowd:'few',festive:true,patrons:true,sports:'both',carriage:true,speed:.35,sky:'classic',mtns:'smooth'};

/* ---------- palette ---------- */
const COL={timber:'#3b2417',timberD:'#2a170e',stone:'#8d8a96',stoneD:'#615e6c',stoneL:'#b1aebb',glass:'#283152',
win:'#ffc96b',win2:'#ffb257',winB:'#fff0b0',snow:'#eef3ff',snowS:'#c5d1ec',snowD:'#9aa9cf',green:'#1d4a2c',greenL:'#2e6a3b',
greenD:'#12311d',wood:'#6e4426',woodL:'#8e5c33',woodD:'#43281a',gold:'#e9bb4c',iron:'#24242e',copper:'#4e9b86',copperL:'#7cc6ae',
copperD:'#2e6c5c',red:'#b3262e',bulbW:'#ffe2a0',wall:'#ece6d6',wallS:'#cfc6b0'};

const SKIN=['#f1c9a5','#d9a07a','#a86b48','#6e4630'];
const TIMES={
 golden:{tk:'golden',label:'Golden hour',sky:['#3e3f78','#7b5c93','#cf7f84','#f2b277','#f7d08a'],mtn:'#8a7aa6',mtnS:'#f1d8cf',mtnD:'#6e6390',forest:'#463f68',forestS:'#a596b8',dark:'rgba(70,40,80,0.30)',k:0.45,lit:0.45,stars:0,sun:true,smoke:'#b9a8b8'},
 blue:{tk:'blue',label:'Blue hour',sky:['#0c1534','#1b2b5e','#2f4a8a','#5470ad','#8a8fc0'],mtn:'#34457a',mtnS:'#9aaee0',mtnD:'#28376a',forest:'#18224c',forestS:'#4c5f96',dark:'rgba(14,24,66,0.6)',k:0.85,lit:0.72,stars:0.35,smoke:'#6a7398'},
 midnight:{tk:'midnight',label:'Midnight',sky:['#02040c','#070d26','#0f1a40','#172752','#203563'],mtn:'#17213f',mtnS:'#4a5a8a',mtnD:'#111a35',forest:'#0a1129',forestS:'#26355f',dark:'rgba(4,8,30,0.8)',k:1,lit:0.82,stars:1,moon:true,smoke:'#3e4766'}
};
const SKIES={
 rose:{golden:['#3a2f6b','#7a4c8f','#c9658f','#f08a8a','#f9b8a0'],blue:['#151a44','#33306e','#5c4a8e','#8c62a0','#c584a8'],midnight:['#05040f','#120c2a','#22163f','#33204f','#452a5c'],sun:'255,140,150',sunD:'#ffc4b8'},
 ember:{golden:['#2b1d45','#6b2f4f','#b8463f','#e8783a','#f8b04a'],blue:['#101634','#2b2450','#5a2f55','#8e3f4a','#c0604a'],midnight:['#05030a','#120a1c','#22102a','#341630','#4a1e30'],sun:'255,120,60',sunD:'#ffd08a'},
 violet:{golden:['#26205a','#4a3a8a','#8a5ab8','#c48ad0','#f0c0d8'],blue:['#0e0f38','#211c5a','#3d2c80','#5e3e9e','#8a5cb8'],midnight:['#04030e','#0c0828','#170f40','#221656','#2e1c66'],sun:'220,160,255',sunD:'#fbe0ff'},
 arctic:{golden:['#2a4a78','#4a7aa8','#7ab0c8','#b8dcd8','#f0e8c8'],blue:['#06183a','#0d2c5a','#16487a','#2a6a96','#5a9ab8'],midnight:['#010610','#031428','#06223c','#0a3050','#103c5e'],sun:'255,230,180',sunD:'#fff4d8',aurora:true}
};
function mixHex(a,b,t){const x=rgb(a),y=rgb(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const palCache={};
function palette(){
  const base=curTime(),th=SKIES[S.sky];if(!th)return base;const key=base.tk+S.sky;if(palCache[key])return palCache[key];
  const sky=th[base.tk],tint=sky[2],f=base.tk==='golden'?.3:.22;
  return palCache[key]=Object.assign({},base,{sky,label:base.label+'/'+S.sky,sunC:th.sun,sunD:th.sunD,aurora:th.aurora&&base.tk!=='golden',
    mtn:mixHex(base.mtn,tint,f),mtnD:mixHex(base.mtnD,tint,f*.8),mtnS:mixHex(base.mtnS,sky[4],.18),forest:mixHex(base.forest,tint,f*.6)});
}
function curTime(){
  if(S.time!=='auto') return TIMES[S.time];
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  if(h>=8&&h<16.5) return TIMES.golden;
  if((h>=16.5&&h<17.6)||(h>=6.6&&h<8)) return TIMES.blue;
  return TIMES.midnight;
}

/* ---------- helpers ---------- */
function R(c,x,y,w,h,col){if(w<=0||h<=0)return;c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function P(c,x,y,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),1,1);}
function LN(c,x0,y0,x1,y1,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;c.fillStyle=col;
  for(let n=0;n<400;n++){c.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function hash(n){n=(n*2654435761)|0;n^=n>>>15;n=Math.imul(n,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return (n>>>0)/4294967296;}
const rgbCache={};
function rgb(hex){if(rgbCache[hex])return rgbCache[hex];const n=parseInt(hex.slice(1),16);return rgbCache[hex]=[n>>16&255,n>>8&255,n&255];}
function rgbStr(hex){const a=rgb(hex);return a.join(',');}
const shCache={};
function shade(hex,f){const k=hex+f;if(shCache[k])return shCache[k];const a=rgb(hex).map(v=>Math.max(0,Math.min(255,Math.round(v*f))));return shCache[k]='#'+a.map(v=>v.toString(16).padStart(2,'0')).join('');}
function addLight(x,y,r,rgbs,a){if(LIGHTS)LIGHTS.push({x,y,r,c:rgbs,a});}
const glowCache={};
function glow(c){if(glowCache[c])return glowCache[c];const [g,gx]=mk();g.width=g.height=64;
  const gr=gx.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,`rgba(${c},1)`);gr.addColorStop(.25,`rgba(${c},.45)`);gr.addColorStop(1,`rgba(${c},0)`);
  gx.fillStyle=gr;gx.fillRect(0,0,64,64);return glowCache[c]=g;}
function disc(c,cx,cy,r,col,sh){for(let dy=-r;dy<=r;dy++){const hw=Math.round(Math.sqrt(r*r+r*.6-dy*dy));R(c,cx-hw,cy+dy,2*hw+1,1,col);if(sh)R(c,cx+hw-1,cy+dy,2,1,sh);}}
function emitP(x,y,kind,rate){if(!FX)return;if(Math.random()<dt*rate)parts.push({x:x+(Math.random()-.5)*2,y,vx:(Math.random()-.5)*2,vy:-(3+Math.random()*3),life:0,max:kind==='steam'?1.8:4.5,kind});}

/* ---------- shared building bits ---------- */
function win(c,it,k,x,y,w,h,m,sh){
  if(m===0){
    R(c,x-1,y-1,w+2,h+2,COL.timber);R(c,x,y,w,h,COL.glass);R(c,x,y,w,1,'#161c36');R(c,x,y,1,h,'#1b2240');
    if(sh){R(c,x-3,y-1,2,h+2,sh);R(c,x+w+1,y-1,2,h+2,sh);P(c,x-3,y-1,shade(sh,1.3));P(c,x+w+2,y+h,shade(sh,.6));for(let yy=y+1;yy<y+h;yy+=2){P(c,x-2,yy,shade(sh,.75));P(c,x+w+1,yy,shade(sh,.75));}}
    R(c,x+(w>>1),y,1,h,COL.timber);R(c,x,y+(h>>1),w,1,COL.timber);
    R(c,x-2,y+h+1,w+4,1,COL.stoneL);R(c,x-1,y+h+2,w+2,1,'rgba(20,10,40,.3)');
    if(cover){R(c,x-2,y+h,w+4,1,COL.snow);P(c,x+w+1,y+h+1,COL.snowS);}
  }else{
    const hv=hash(it.id*97+k*13);
    if(hv<litProb){
      const fl=hv<0.15?0.75+0.25*Math.sin(T*8+k*3+Math.sin(T*13+k)):1,wc=hv<litProb*.5?COL.win:COL.win2;
      R(c,x,y,w,h,wc);R(c,x,y,w,1,shade(wc,.72));R(c,x,y+1,1,h-1,shade(wc,.82));R(c,x+1,y+h-2,w-1,1,COL.winB);
      if(w>=5&&hash(it.id*5+k)<.45){const cu=['#b8503a','#e8dcc0','#4a6a3a'][(it.id+k)%3];R(c,x,y,1,h,cu);R(c,x+w-1,y,1,h,cu);}
      R(c,x+(w>>1),y,1,h,COL.timberD);R(c,x,y+(h>>1),w,1,COL.timberD);
      if(cover)R(c,x-1,y+h,w+2,1,COL.snow);

}
function gable(c,ax,ay,rh,hm,face,rf,band){
  band=band||3;const hs=[];
  for(let i=0;i<rh;i++){const hf=Math.round((i+1)*hm/rh);hs.push(hf);const yy=ay+i;
    if(face){R(c,ax-hf+band,yy,2*hf-2*band,1,face);}else R(c,ax-hf,yy,2*hf,1,rf);
    const hl=shade(rf,1.3),md=i%2?rf:shade(rf,.86),dk=shade(rf,.62);
    R(c,ax-hf,yy,band,1,md);P(c,ax-hf,yy,hl);P(c,ax-hf+band-1,yy,dk);
    R(c,ax+hf-band,yy,band,1,md);P(c,ax+hf-1,yy,shade(rf,1.1));P(c,ax+hf-band,yy,dk);
    if(face&&2*hf-2*band>2){P(c,ax-hf+band,yy,shade(face,.72));P(c,ax-hf+band+1,yy,shade(face,.86));P(c,ax+hf-band-1,yy,shade(face,.7));P(c,ax+hf-band-2,yy,shade(face,.84));}
  }

    brackets(ctx,it.x-cxr-2,baseY(it)-ty.h-3,ty.w+4,ty.h+5,pulse>.5?'#ffb070':'#ffffff');}
  if(d.px!=null){const ty=TYPES[d.type],by0=d.row==='back'?BY:FY,tmp={id:-5,type:d.type,x:d.px,row:d.row,v:d.v,lights:d.lights,garland:d.garland};
    ctx.globalAlpha=d.target?.5+.15*pulse:.55+.25*pulse;ctx.drawImage(getCache(tmp),d.px-cxr-PAD,by0-ty.h-PAD);ctx.globalAlpha=1;
    if(!d.target){const col=pulse>.5?'#7ce08a':'#e4ffe9',x0=d.px-cxr-2,y0=by0-ty.h-3,w=ty.w+4,h=ty.h+5;for(let i=0;i<w;i+=3){P(ctx,x0+i,y0,col);P(ctx,x0+i,y0+h,col);}for(let i=0;i<=h;i+=3){P(ctx,x0,y0+i,col);P(ctx,x0+w,y0+i,col);}}}
}
let TD=null,suppressClick=false;
function tileDown(e,k,el){
  if(e.button>0)return;
  TD={k,el,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY,id:e.pointerId,started:false};
  TD.lp=setTimeout(()=>{if(TD&&!TD.started)startDrag();},300);
}
function startDrag(){
  const t=TD;t.started=true;try{t.el.setPointerCapture(t.id);}catch(_){}
  const df=defaults(t.k);DRAG={type:t.k,v:Math.floor(Math.random()*1024),dl:df.lights,dg:df.garland,lights:df.lights,garland:df.garland,cx:t.cx,cy:t.cy,over:false,target:null,px:null,edge:0};
  const g=$('#ghost'),th=thumbs[t.k];g.width=th.width;g.height=th.height;g.getContext('2d').drawImage(th,0,0);
  document.body.classList.add('dragging');t.el.classList.add('drag');if(navigator.vibrate)try{navigator.vibrate(12);}catch(_){}
  updDrag();
}
function endDrag(drop){
  if(!TD)return;clearTimeout(TD.lp);
  if(TD.started){if(drop)dropDrag();suppressClick=true;setTimeout(()=>suppressClick=false,60);TD.el.classList.remove('drag');}
  TD=null;DRAG=null;document.body.classList.remove('dragging');$('#ghost').style.display='none';$('#dragLbl').style.display='none';
}
window.addEventListener('pointermove',e=>{
  if(!TD||e.pointerId!==TD.id)return;TD.cx=e.clientX;TD.cy=e.clientY;
  if(!TD.started){const dx=e.clientX-TD.sx,dy=e.clientY-TD.sy;
    const touch=e.pointerType==='touch';if(Math.hypot(dx,dy)>7&&(!touch||Math.abs(dy)>Math.abs(dx)*.6))startDrag();else if(touch&&Math.abs(dx)>10){clearTimeout(TD.lp);TD=null;}return;}
  DRAG.cx=e.clientX;DRAG.cy=e.clientY;updDrag();e.preventDefault();
},{passive:false});
window.addEventListener('pointerup',e=>{if(TD&&e.pointerId===TD.id)endDrag(true);});
window.addEventListener('pointercancel',e=>{if(TD&&e.pointerId===TD.id)endDrag(false);});
window.addEventListener('contextmenu',e=>{if(TD)e.preventDefault();});

/* ---------- persistence ---------- */
const KEY='christkindlmarkt.v1';
function save(){const j=JSON.stringify({S,items:items.map(({_vx,_rx,...o})=>o),nextId});try{localStorage.setItem(KEY,j);}catch(e){}try{if(window.AndroidBridge&&AndroidBridge.save)AndroidBridge.save(j);}catch(e){}}
function load(){let j=null;try{if(window.AndroidBridge&&AndroidBridge.load)j=AndroidBridge.load()||null;}catch(e){}
  if(!j){try{j=localStorage.getItem(KEY);}catch(e){}}
  if(j){try{const o=JSON.parse(j);if(o&&Array.isArray(o.items)){S=Object.assign(S,o.S||{});items=o.items.filter(i=>TYPES[i.type]);nextId=o.nextId||items.length+1;return;}}catch(e){}}
  sample();
}
function sample(){
  items=[];nextId=1;
  const back=['house','town','gasthaus','bakery','church','rathaus','erker','tree','chalet','house','gate','brauhaus','town','house','gasthaus','tree'];
  const front=['lamp','gluehwein','tree','candlepost','lebkuchen','nutcracker','wurst','lamp','maroni','pyramid','bigtree','ornaments','gifts','kerzen','lamp','mandeln','reindeer','snowman','toys','candlepost','gluehwein','sleigh','tree','lebkuchen','nutcracker','lamp'];
  let x=6;back.forEach((t,i)=>{items.push({id:nextId++,type:t,x,row:'back',v:(i*137+11)%1024,lights:t==='tree'?'warm':(i%2?'color':'warm'),garland:['fir','flocked','fir'][i%3]});x+=TYPES[t].w+2;});
  x=4;front.forEach((t,i)=>{items.push({id:nextId++,type:t,x,row:'front',v:(i*71+5)%1024,lights:t==='lamp'?'none':(i%3===0?'color':'warm'),garland:TYPES[t].noDeco?'none':(t==='tree'?'flocked':'fir')});x+=TYPES[t].w+4;});
}

/* ---------- UI ---------- */
const OPTS={time:[['golden','Golden'],['blue','Blue hr'],['midnight','Night'],['auto','Auto']],snow:[['off','Off'],['light','Light'],['heavy','Heavy']],
  sky:[['classic','Classic'],['rose','Rose'],['ember','Ember'],['violet','Violet'],['arctic','Arctic']],mtns:[['smooth','Smooth'],['jagged','Jagged'],['snowy','Snowy'],['forest','Forested']],crowd:[['off','Off'],['few','Few'],['busy','Busy']],festive:[[false,'Plain'],[true,'Festive']],patrons:[[false,'Off'],[true,'On']],sports:[['none','None'],['ski','Skiers'],['skate','Skaters'],['both','Both']],carriage:[[false,'Off'],[true,'On']],santa:[[false,'Off'],[true,'On']],follow:[[false,'Auto drift'],[true,'Follow']],cover:[[true,'On'],[false,'Off']],visitors:[[true,'On'],[false,'Off']]};
const TLABEL={golden:'☀ Golden',blue:'◐ Blue hour',midnight:'☾ Midnight',auto:'⏱ Auto'};
function syncTop(){if((cat==='Scene'||cat==='People')&&$('#tiles').className==='scene')buildTiles();$('#bTime').textContent=TLABEL[S.time];$('#bSnow').textContent='❄ '+{off:'Off',light:'Light',heavy:'Heavy'}[S.snow];
  document.querySelectorAll('#sheet .seg').forEach(seg=>{const k=seg.dataset.k;seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(S[k])===b.dataset.v));});}
document.querySelectorAll('#sheet .seg').forEach(seg=>{const k=seg.dataset.k;if(!OPTS[k])return;OPTS[k].forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=String(v);
  b.onclick=()=>{S[k]=v;syncTop();save();};seg.appendChild(b);});});
$('#bTime').onclick=()=>{const ks=['golden','blue','midnight','auto'];S.time=ks[(ks.indexOf(S.time)+1)%4];syncTop();save();toast(S.time==='auto'?'Auto: follows your local time':TIMES[S.time].label);};
$('#bSnow').onclick=()=>{const ks=['off','light','heavy'];S.snow=ks[(ks.indexOf(S.snow)+1)%3];syncTop();save();};
$('#bSet').onclick=()=>{$('#sheet').hidden=false;};
$('#bClose').onclick=()=>{$('#sheet').hidden=true;};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').hidden=true;};
$('#bSample').onclick=()=>{sample();cache.clear();recomputeWorld();select(null);save();$('#sheet').hidden=true;toast('Sample market restored');};
let clearArm=0;$('#bClear').onclick=()=>{if(Date.now()-clearArm>2500){clearArm=Date.now();$('#bClear').textContent='Tap again to clear';setTimeout(()=>$('#bClear').textContent='Clear all',2500);return;}
  items=[];cache.clear();select(null);recomputeWorld();save();$('#bClear').textContent='Clear all';$('#sheet').hidden=true;toast('Empty square — start building!');};

function thumb(type){
  const ty=TYPES[type],s=Math.max(ty.w,ty.h)+8,[c,x]=mk();c.width=c.height=s;x.fillStyle='#141c3a';x.fillRect(0,0,s,s);
  const it={id:900+Object.keys(TYPES).indexOf(type),type,x:0,v:3,lights:type==='lamp'?'none':'warm',garland:'fir'};
  const sv=[LIGHTS,FX,cover,litProb];LIGHTS=null;FX=false;cover=true;litProb=.85;
  x.fillStyle='#e8eefc';x.fillRect(0,s-4,s,4);
  ty.draw(x,it,Math.floor((s-ty.w)/2),s-4,0);if(ty.anim)ty.anim(x,it,Math.floor((s-ty.w)/2),s-4);ty.draw(x,it,Math.floor((s-ty.w)/2),s-4,1);
  [LIGHTS,FX,cover,litProb]=sv;return c;
}
const thumbs={};
function buildTiles(){
  const box=$('#tiles');box.innerHTML='';box.className='';
  if(cat==='Scene'||cat==='People'){box.className='scene';
    const rows=cat==='Scene'?[['sky','Sky'],['mtns','Mountains'],['time','Time of day']]:[['crowd','Crowd'],['festive','Outfits'],['patrons','Market-goers'],['sports','Winter sports'],['carriage','Carriage'],['santa','Santa sleigh']];
    for(const [k,lab] of rows){const r=document.createElement('div');r.className='srow';
      const l=document.createElement('span');l.className='lab';l.textContent=lab;const seg=document.createElement('div');seg.className='seg';
      OPTS[k].forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.classList.toggle('on',String(S[k])===String(v));b.onclick=()=>{S[k]=v;if(k==='crowd')syncCrowd();if(k==='carriage'&&v)carT=1.5;if(k==='santa'&&v){santaT=1.5;}syncTop();save();};seg.appendChild(b);});
      r.append(l,seg);box.appendChild(r);}
    return;}
  for(const [k,ty] of Object.entries(TYPES)){if(ty.cat!==cat)continue;
    const d=document.createElement('div');d.className='tile'+(tool===k?' sel':'');thumbs[k]=thumbs[k]||thumb(k);
    const c=document.createElement('canvas');c.width=thumbs[k].width;c.height=thumbs[k].height;c.getContext('2d').drawImage(thumbs[k],0,0);
    const sp=document.createElement('span');sp.textContent=ty.name;d.append(c,sp);
    d.addEventListener('pointerdown',e=>tileDown(e,k,d));d.onclick=()=>{if(suppressClick)return;tool=tool===k?null:k;buildTiles();hint();};box.appendChild(d);}
}
function hint(){$('#hint').textContent=cat==='People'?'Market-goers stop at stalls for treats · skiers need snow cover · Santa flies over every minute or so':cat==='Scene'?'Backdrop changes apply live · each sky has golden, blue-hour and midnight tones':tool?`Tap the street to place: ${TYPES[tool].name} · tap again to stop`:'Drag a tile onto the market — drop it on something to swap it · tap a tile to stamp · tap anything to decorate';}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));buildTiles();hint();});

const IOPT={lights:[['none','Off'],['warm','Warm'],['color','Colour']],garland:[['none','None'],['fir','Fir'],['flocked','Flocked']]};
const TREEG=[['none','Bare'],['fir','Dusted'],['flocked','Flocked']];
function select(it){
  selected=it;$('#palette').hidden=!!it;$('#inspector').hidden=!it;if(!it)return;
  const ty=TYPES[it.type];$('#iName').textContent=ty.name;
  const isTree=it.type==='tree'||it.type==='bigtree';$('#gLab').textContent=isTree?'Branches':it.type==='lamp'?'Wrap':'Garland';
  $('#rLights').hidden=it.type==='lamp'||it.type==='pyramid'||!!ty.noDeco;$('#rGarland').hidden=!!ty.noDeco||!!ty.noGarland||it.type==='pyramid';
  for(const p of ['lights','garland']){const seg=document.querySelector(`#inspector .seg[data-p="${p}"]`);seg.innerHTML='';
    (p==='garland'&&isTree?TREEG:IOPT[p]).forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.classList.toggle('on',it[p]===v);
      b.onclick=()=>{it[p]=v;save();select(it);};seg.appendChild(b);});}
}
$('#iDone').onclick=()=>select(null);
$('#iStyle').onclick=()=>{if(selected){selected.v=Math.floor(Math.random()*1024);save();}};
$('#iDel').onclick=()=>{if(selected){items=items.filter(i=>i!==selected);cache.delete(selected.id);select(null);recomputeWorld();save();}};

let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* pointer (on the stage; canvases ignore pointer events) */
let ptr=null;
function toL(e){const r=stageEl.getBoundingClientRect();const x=(e.clientX-r.left)*DPR/K,y=H-(r.bottom-e.clientY)*DPR/K;return {x,y,wx:x+camX};}
stageEl.addEventListener('pointerdown',e=>{
  if(e.target!==stageEl)return;try{stageEl.setPointerCapture(e.pointerId);}catch(_){}const p=toL(e);glide=0;
  ptr={sx:e.clientX,sy:e.clientY,cam:camX,moved:false,drag:null,lx:e.clientX,lt:performance.now(),v:0};
  if(mode==='build'&&selected&&hitTest(p.wx,p.y)===selected)ptr.drag={it:selected,off:p.wx-selected.x};
});
stageEl.addEventListener('pointermove',e=>{
  if(!ptr)return;const dx=e.clientX-ptr.sx,dy=e.clientY-ptr.sy;if(Math.abs(dx)+Math.abs(dy)>6)ptr.moved=true;if(!ptr.moved||mode!=='build')return;
  if(ptr.drag){const p=toL(e),it=ptr.drag.it,nx=Math.round((p.wx-ptr.drag.off)/2)*2;if(fits(it.type,nx,it.row,it))it.x=nx;
    if(TYPES[it.type].row==='any'){const nr=p.y<H-30?'back':'front';if(nr!==it.row&&fits(it.type,it.x,nr,it))it.row=nr;}}
  else{camX=ptr.cam-dx*DPR/K;clampCam();const now=performance.now(),ddt=Math.max(1,now-ptr.lt);ptr.v=ptr.v*.6+.4*(-(e.clientX-ptr.lx)*DPR/K/(ddt/1000));ptr.lx=e.clientX;ptr.lt=now;}
});
stageEl.addEventListener('pointerup',e=>{
  if(!ptr)return;const p=toL(e),moved=ptr.moved,drag=ptr.drag,v=ptr.v,stale=performance.now()-ptr.lt>90;ptr=null;
  if(mode==='wall'){if(!moved)peek();return;}
  if(moved){if(drag){recomputeWorld();save();}else if(!stale)glide=Math.max(-400,Math.min(400,v));return;}
  const hit=hitTest(p.wx,p.y);
  if(tool&&!selected){const ty=TYPES[tool],row=ty.row==='any'?(p.y<H-30?'back':'front'):ty.row;
    if(hit&&(hit.row==='back')===(row==='back')){select(hit);return;}place(tool,p.wx,p.y);return;}
  if(hit)select(hit);else select(null);
});
stageEl.addEventListener('pointercancel',()=>{ptr=null;});
stageEl.addEventListener('wheel',e=>{if(mode!=='build')return;camX+=(e.deltaX||e.deltaY)*.25;clampCam();e.preventDefault();},{passive:false});

/* wallpaper mode */
let peekT=0;
function peek(){document.body.classList.add('peek');clearTimeout(peekT);peekT=setTimeout(()=>document.body.classList.remove('peek'),3500);}
function setMode(m){
  mode=m;document.body.classList.toggle('wall',m==='wall');select(null);glide=0;
  if(m==='wall'){try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().catch(()=>{});}catch(_){}
    try{history.replaceState(null,'','#wallpaper');}catch(_){}peek();}
  else{try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(_){}try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  requestAnimationFrame(()=>{resize();const mc=maxCam();wpPhase=mc?Math.acos(Math.max(-1,Math.min(1,1-2*camX/mc))):0;});
}
function syncSpeed(){const v=Math.round(S.speed*100);$('#spd').value=v;$('#spdW').value=v;$('#spdL').textContent=speedLabel(S.speed);}
let spdSave=0;
for(const id of ['#spd','#spdW'])$(id).addEventListener('input',e=>{S.speed=e.target.value/100;syncSpeed();if(mode==='wall')peek();clearTimeout(spdSave);spdSave=setTimeout(save,300);});
$('#bWall').onclick=()=>setMode('wall');
$('#exitWall').onclick=()=>setMode('build');
window.addEventListener('resize',resize);try{new ResizeObserver(()=>resize()).observe(stageEl);}catch(_){}
window.setWallpaperOffset=f=>{wpOff=Math.max(0,Math.min(1,+f));};
function reloadState(){load();cache.clear();palCache&&Object.keys(palCache).forEach(k=>delete palCache[k]);skyC=null;recomputeWorld();syncCrowd();syncTop();syncSpeed();if(!$('#tiles').className)buildTiles();}
window.market={set:(k,v)=>{S[k]=v;syncTop();},setPaused:v=>{paused=!!v;},reload:reloadState,
  back:()=>{if(mode==='wall'&&!document.body.classList.contains('svc')){setMode('build');return true;}if(!$('#sheet').hidden){$('#sheet').hidden=true;return true;}if(selected){select(null);return true;}if(tool){tool=null;buildTiles();hint();return true;}return false;},santa:()=>{santaT=0;santa=null;},spawn:(k,x)=>{spawnAt(k,{sp:k==='carriage'?8:10});agents[agents.length-1].x=x;},get agents(){return agents;},get state(){return {S,items,camX};},setSpeed:v=>{S.speed=v;syncSpeed();},setTime:t=>{S.time=t;syncTop();},setSnow:s=>{S.snow=s;syncTop();},wallpaper:()=>setMode('wall'),build:()=>setMode('build')};

/* boot */
load();if(S.crowd==null)S.crowd=S.visitors===false?'off':'few';for(const [k,v] of [['santa',true],['festive',true],['patrons',true],['sports','both'],['carriage',true]])if(S[k]==null)S[k]=v;recomputeWorld();if(S.speed==null)S.speed=.35;S.sky=S.sky||'classic';S.mtns=S.mtns||'smooth';cover=S.cover;syncCrowd();syncTop();syncSpeed();buildTiles();hint();resize();camX=150;clampCam();
let isSvc=false;try{isSvc=!!(window.AndroidBridge&&AndroidBridge.isWallpaper&&AndroidBridge.isWallpaper());}catch(_){}
if(isSvc)document.body.classList.add('svc');
try{if(window.AndroidBridge&&AndroidBridge.canSetWallpaper&&AndroidBridge.canSetWallpaper()){const b=document.createElement('button');b.className='gold';b.textContent='📱 Set wallpaper';b.onclick=()=>{save();AndroidBridge.setWallpaper();};$('.tb').appendChild(b);$('#bWall').textContent='▶ Preview';$('#bWall').classList.remove('gold');}}catch(_){}
if(location.hash==='#wallpaper'||isSvc)setMode('wall');
requestAnimationFrame(loop);
})();
